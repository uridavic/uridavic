<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uridavic - Fotos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <xp-header></xp-header>

    <main class="container">
        <section>
            <h2 class="page-title">Galería de Fotos</h2>
            <p>Aquí puedes ver algunas imágenes (placeholders para el ejemplo).</p>
            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px;">
                <div style="border: 2px solid #000; padding: 5px; background: #fff;">
                    <img src="img/uridavic1.jpg" alt="Foto 1">
                    <p style="font-size: 0.8rem; margin: 5px 0 0 0;">Paisaje Digital 01</p>
                </div>
                <div style="border: 2px solid #000; padding: 5px; background: #fff;">
                    <img src="https://via.placeholder.com/200x150?text=Foto+2" alt="Foto 2">
                    <p style="font-size: 0.8rem; margin: 5px 0 0 0;">Recuerdos del 2000</p>
                </div>
                <div style="border: 2px solid #000; padding: 5px; background: #fff;">
                    <img src="https://via.placeholder.com/200x150?text=Foto+3" alt="Foto 3">
                    <p style="font-size: 0.8rem; margin: 5px 0 0 0;">Abstracto Retro</p>
                </div>
            </div>
        </section>
    </main>

    <xp-footer></xp-footer>

    <script src="js/components.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
